plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fluxhub.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fluxhub.mobile'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'FLUXHUB_URL', groovy.json.JsonOutput.toJson(System.getenv('FLUXHUB_URL') ?: '')
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
