# FluxHub — configuração HTTP inicial para Nginx em VPS Ubuntu/Debian.
# PRÉ-REQUISITOS: DNS @/www -> 187.77.230.250,
# Next.js em 127.0.0.1:3000, FastAPI em 127.0.0.1:8000.
# Após habilitar este arquivo e verificar DNS, execute:
# sudo certbot --nginx -d myfluxhub.tech -d www.myfluxhub.tech --redirect
# O Certbot modifica este bloco para habilitar HTTPS e redirecionar HTTP.
# Não exponha as portas internas 3000/8000 no firewall público.

server {
    listen 80;
    listen [::]:80;
    server_name myfluxhub.tech www.myfluxhub.tech;

    # A API permanece acessível ao Next.js por loopback; clientes públicos
    # devem apresentar o BACKEND_TOKEN, validado pelo FastAPI protegido.
    location = /backend-api {
        return 308 /backend-api/;
    }

    location /backend-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Abrange /login, /financeiro, /dados, /api/auth/* e arquivos Next.js.
    # Inclui o callback OAuth do Mercado Livre em /api/v1/connectors/mercado-livre/callback.
    # Essa rota vai para o Next.js, que repassa apenas code/state ao FastAPI internamente.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}
