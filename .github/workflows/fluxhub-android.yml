name: FluxHub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-webview/**"
      - ".github/workflows/fluxhub-android.yml"
  pull_request:
    paths:
      - "android-webview/**"
      - ".github/workflows/fluxhub-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar API 36 no SDK do runner
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Testar regras de URL
        run: bash android-webview/test-url-policy.sh
      - name: Compilar APK de teste
        run: gradle --project-dir android-webview :app:assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FluxHub-Android-debug-apk
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
